services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pacifico:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/pacifico
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-134217728}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8787}:8787'
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: pacifico
      POSTGRES_DB: pacifico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U pacifico -d pacifico']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
