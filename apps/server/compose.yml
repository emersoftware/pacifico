services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    environment:
      DATABASE_URL: postgres://pacifico:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/pacifico
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-134217728}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8787}:8787'
    networks: [default, database]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: &logging
      driver: local
      options: { max-size: 10m, max-file: '3' }
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,uid=999,gid=999,mode=0755
    environment:
      POSTGRES_USER: pacifico
      POSTGRES_DB: pacifico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U pacifico -d pacifico']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
networks:
  database:
    internal: true
volumes:
  postgres_data:
