name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BUN_VERSION: '1.3.13'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: pacifico-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            artifact: pacifico-darwin-x86_64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: pacifico-linux-x86_64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: pacifico-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version
        run: |
          test "$RELEASE_TAG" = "v$(bun -p 'require("./package.json").version')"

      - run: bun run generate-plugin-embed

      - name: Compile binary
        run: bun build --compile --minify --target=${{ matrix.target }} apps/cli/src/index.ts --outfile dist/pacifico

      - name: Test native executable
        run: bun run test:binary

      - name: Package tarball
        run: tar czf ${{ matrix.artifact }}.tar.gz -C dist pacifico -C .. LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  attach-binaries:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute checksums
        run: sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
          files: |
            *.tar.gz
            SHA256SUMS
