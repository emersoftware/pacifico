name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BUN_VERSION: '1.3.13'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: pacifico-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            artifact: pacifico-darwin-x86_64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: pacifico-linux-x86_64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: pacifico-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version
        run: |
          test "$RELEASE_TAG" = "v$(bun -p 'require("./package.json").version')"

      - run: bun run generate-plugin-embed

      - name: Compile binary
        run: bun build --compile --minify --target=${{ matrix.target }} apps/cli/src/index.ts --outfile dist/pacifico

      - name: Test native executable
        run: bun run test:binary

      - name: Package tarball
        run: tar czf ${{ matrix.artifact }}.tar.gz -C dist pacifico -C .. LICENSE NOTICE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  attach-binaries:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute checksums
        run: sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
          files: |
            *.tar.gz
            SHA256SUMS

  update-formula:
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    needs: [build, attach-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update formula
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          VER="${VERSION#v}"
          export SHA_DARWIN_ARM64=$(shasum -a 256 pacifico-darwin-arm64.tar.gz | cut -d' ' -f1)
          export SHA_DARWIN_X86_64=$(shasum -a 256 pacifico-darwin-x86_64.tar.gz | cut -d' ' -f1)
          export SHA_LINUX_X86_64=$(shasum -a 256 pacifico-linux-x86_64.tar.gz | cut -d' ' -f1)
          export SHA_LINUX_ARM64=$(shasum -a 256 pacifico-linux-arm64.tar.gz | cut -d' ' -f1)
          cd tap
          sed -i "s/version \".*\"/version \"${VER}\"/" Formula/pacifico.rb
          python3 - <<'PY'
          import os, re, sys
          f = 'Formula/pacifico.rb'
          txt = open(f).read()
          # Exact artifact-filename -> checksum. Each artifact's sha256 lives on
          # the line right after its url, so we anchor on the full tarball name
          # and rewrite only that block. A broad arch/os regex would collide
          # (e.g. 'arm64' matches both darwin and linux, 'linux' matches both
          # x86_64 and arm64), so we key on the exact published filename.
          mapping = {
              'pacifico-darwin-arm64.tar.gz': os.environ['SHA_DARWIN_ARM64'],
              'pacifico-darwin-x86_64.tar.gz': os.environ['SHA_DARWIN_X86_64'],
              'pacifico-linux-x86_64.tar.gz': os.environ['SHA_LINUX_X86_64'],
              'pacifico-linux-arm64.tar.gz': os.environ['SHA_LINUX_ARM64'],
          }
          for artifact, sha in mapping.items():
              pattern = re.compile(
                  r'(' + re.escape(artifact) + r'\"\s*\n\s*sha256 \")([a-fA-F0-9]+|PLACEHOLDER_\w+)(\")'
              )
              txt, n = pattern.subn(lambda m: m.group(1) + sha + m.group(3), txt)
              # Exactly one match required. Zero means the tap formula is missing
              # this artifact's branch (e.g. the Linux ARM64 branch not yet
              # landed), so fail loudly instead of publishing a stale checksum.
              if n != 1:
                  sys.exit(
                      f'expected exactly one sha256 substitution for {artifact}, got {n}'
                  )
          open(f, 'w').write(txt)
          PY

      - name: Commit formula
        run: |
          cd tap
          git config user.name "Emerson"
          git config user.email "87254036+emersoftware@users.noreply.github.com"
          git add Formula/pacifico.rb
          git diff --cached --quiet || git commit -m "pacifico: update to ${{ env.RELEASE_TAG }}"
          git push
